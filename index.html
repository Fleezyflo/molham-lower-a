<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Workout Log"/>
<meta name="theme-color" content="#0b0d10"/>
<title>Upper A — Mon</title>
<style>
:root{--bg:#0b0d10;--card:#161a22;--card2:#1e2430;--text:#f3f5f8;--muted:#9aa3b2;--accent:#5eead4;--good:#4ade80;--line:#2a3140;--input:#0f131a;--danger:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.35}
header{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px}
h1{margin:0;font-size:1.2rem}.sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.progress{margin-top:10px;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .2s}
main{padding:12px 12px 190px;max-width:680px;margin:0 auto}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.ex.done{border-color:rgba(74,222,128,.55)}
.ex-head{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 6px}
.ex-head>input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);margin-top:6px;flex-shrink:0}
.ex-title{flex:1;min-width:0}
.ex-title input.name{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:1.02rem;font-weight:700}
.target{color:var(--accent);font-size:.85rem;font-weight:700;margin-top:4px}
.tip{color:var(--muted);font-size:.8rem;margin-top:4px}
.ex-actions{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.ex-actions button{padding:8px 10px;font-size:.78rem;font-weight:600}
.set-labels,.set-row{display:grid;grid-template-columns:32px 1fr 1fr 40px;gap:6px;align-items:center}
.set-labels{color:var(--muted);font-size:.68rem;text-transform:uppercase;padding:0 12px;margin-top:4px}
.set-row{background:var(--card2);border-radius:10px;padding:8px;margin:6px 12px}
.set-row label{text-align:center;color:var(--muted);font-weight:700;font-size:.8rem}
.set-row input[type=number]{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 8px;font-size:1.05rem;text-align:center}
.set-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);margin:0 auto;display:block}
.add-box{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.add-box h3{margin:0 0 8px;font-size:.95rem;color:var(--muted);font-weight:600}
.add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-row input[type=text],.add-row input[type=number]{background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 10px;font-size:1rem}
.add-row input[type=text]{flex:1;min-width:140px}
.add-row input[type=number]{width:72px;text-align:center}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,16,.97);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-width:680px;margin:0 auto}
button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:14px;font-size:1rem;font-weight:700}
button.export{background:var(--accent);color:#042f2e;border:0;font-size:1.08rem}
button.secondary{font-size:.88rem;font-weight:600}
button.add{background:var(--card2);border-color:var(--accent);color:var(--accent);padding:11px 14px;font-size:.9rem}
button.remove{color:var(--danger);border-color:rgba(248,113,113,.35);padding:8px 10px}
button.bump{padding:6px 8px;font-size:.72rem;font-weight:700;color:var(--accent);border-color:rgba(94,234,212,.35)}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:#022c22;color:var(--accent);border:1px solid rgba(94,234,212,.4);padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
.noscript{padding:16px;color:#f87171}
.static-list{list-style:none;margin:0;padding:0}
.static-list li{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;padding:14px 12px;font-weight:700}
.static-list li span{display:block;color:var(--accent);font-size:.85rem;font-weight:700;margin-top:4px}
.ex-photo{display:block;width:calc(100% - 24px);max-width:100%;height:180px;object-fit:cover;border-radius:10px;margin:6px 12px 8px;background:#0f131a;border:1px solid var(--line)}
</style>
</head>

var KEY = SESSION.storageKey;

function makeSets(n, startWeight){
  var sets=[], i, w;
  w = (typeof startWeight === "string" && startWeight) ? startWeight : "";
  for(i=0;i<n;i++) sets.push({weight:w,reps:"",done:false});
  return sets;
}

function emptyState(){
  var s={date:SESSION.date,order:[],exercises:{}};
  var i, d, sets, j;
  for(i=0;i<DEFAULTS.length;i++){
    d=DEFAULTS[i];
    s.order.push(d.id);
    sets=makeSets(d.sets, d.startWeight);
    s.exercises[d.id]={
      name:d.name,
      target:d.target,
      tip:d.tip||"",
      photo:d.photo||"",
      rep_lo:d.rep_lo||8,
      rep_hi:d.rep_hi||12,
      setCount:sets.length,
      done:false,
      sets:sets,
      custom:false
    };
  }
  return s;
}

function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(!r) return emptyState();
    var s=JSON.parse(r);
    if(!s.order||!s.exercises) return emptyState();
    if(!s.date) s.date=SESSION.date;
    var i, id, ex, need;
    for(i=0;i<DEFAULTS.length;i++){
      id=DEFAULTS[i].id;
      if(!s.exercises[id]){
        need=DEFAULTS[i];
        s.exercises[id]={
          name:need.name,target:need.target,tip:need.tip||"",photo:need.photo||"",
          rep_lo:need.rep_lo,rep_hi:need.rep_hi,setCount:need.sets,
          done:false,sets:makeSets(need.sets, need.startWeight),custom:false
        };
        if(s.order.indexOf(id)<0) s.order.push(id);
      }
    }
    for(i=0;i<s.order.length;i++){
      id=s.order[i];
      ex=s.exercises[id];
      if(!ex) continue;
      if(!ex.sets||!ex.sets.length){
        ex.sets=makeSets(ex.setCount||3, "");
      }
      if(typeof ex.name!=="string") ex.name="Exercise";
      for(var di=0;di<DEFAULTS.length;di++){
        if(DEFAULTS[di].id===id && DEFAULTS[di].photo){ ex.photo=DEFAULTS[di].photo; break; }
      }
      if(typeof ex.photo!=="string") ex.photo="";
    }
    return s;
  }catch(e){return emptyState();}
}

var state=load();

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  updateProgress();
}

function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.classList.remove("show");},2400);
}

function updateProgress(){
  var t=0,d=0,i,id,ex,j;
  for(i=0;i<state.order.length;i++){
    id=state.order[i];
    ex=state.exercises[id];
    if(!ex||!ex.sets) continue;
    t+=ex.sets.length;
    for(j=0;j<ex.sets.length;j++) if(ex.sets[j].done) d++;
  }
  document.getElementById("prog").style.width=(t?Math.round(d/t*100):0)+"%";
}

function buildExportText(){
  var lines=[SESSION.exportName,"date: "+state.date,"session: "+SESSION.sessionLabel,"---"];
  var i,id,ex,j,s;
  for(i=0;i<state.order.length;i++){
    id=state.order[i];
    ex=state.exercises[id];
    if(!ex) continue;
    lines.push(ex.name+(ex.done?" [DONE]":""));
    for(j=0;j<ex.sets.length;j++){
      s=ex.sets[j];
      if(s.weight||s.reps||s.done){
        lines.push("  S"+(j+1)+": "+(s.weight||"?")+" kg x "+(s.reps||"?")+" reps"+(s.done?" done":""));
      }
    }
  }
  lines.push("---","Watch: Traditional Strength Training","END_EXPORT");
  return lines.join("\n");
}

function uid(){
  return "custom_"+Date.now()+"_"+Math.floor(Math.random()*10000);
}

function bumpSet1(ex, delta){
  if(!ex.sets||!ex.sets.length) return;
  var cur=parseFloat(ex.sets[0].weight);
  if(isNaN(cur)) cur=0;
  ex.sets[0].weight=String(Math.round((cur+delta)*10)/10);
  save();
  render();
}

function copySet1ToRest(ex){
  if(!ex.sets||ex.sets.length<2){toast("Need 2+ sets");return;}
  var w=ex.sets[0].weight;
  var r=ex.sets[0].reps;
  var z;
  for(z=1;z<ex.sets.length;z++){
    ex.sets[z].weight=w;
    ex.sets[z].reps=r;
    /* leave done unchecked unless already set */
  }
  save();
  render();
  toast("Copied set 1 → rest");
}

function addSet(ex){
  ex.sets.push({weight:"",reps:"",done:false});
  ex.setCount=ex.sets.length;
  if(ex.target && /^\d+\s*sets?$/i.test(ex.target)){
    ex.target=ex.sets.length+" sets";
  }
  ex.done=false;
  save();
  render();
  toast("Set added");
}

function applyHeader(){
  var t=document.getElementById("hdrTitle");
  var s=document.getElementById("hdrSub");
  if(t) t.textContent=SESSION.title;
  if(s) s.textContent=SESSION.subtitle;
  try{document.title=SESSION.title;}catch(e){}
}

function render(){
  var app=document.getElementById("app");
  app.innerHTML="";
  var i,id,ex,art,head,cb,titleWrap,nameInp,targetEl,tipEl,labels,idx,div,row,inputs,actions,btnRm,btnCopy,btnBump25,btnBump5,btnAddSet,addBox;

  for(i=0;i<state.order.length;i++){
    id=state.order[i];
    ex=state.exercises[id];
    if(!ex) continue;

    art=document.createElement("article");
    art.className="ex"+(ex.done?" done":"");
    art.setAttribute("data-id",id);

    head=document.createElement("div");
    head.className="ex-head";

    cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=!!ex.done;
    cb.onchange=(function(exRef){
      return function(e){
        exRef.done=e.target.checked;
        if(exRef.done){
          for(var z=0;z<exRef.sets.length;z++) exRef.sets[z].done=true;
        }
        save();
        render();
      };
    })(ex);

    titleWrap=document.createElement("div");
    titleWrap.className="ex-title";

    nameInp=document.createElement("input");
    nameInp.type="text";
    nameInp.className="name";
    nameInp.value=ex.name;
    nameInp.setAttribute("aria-label","Exercise name");
    nameInp.oninput=(function(exRef){
      return function(e){
        exRef.name=e.target.value;
        save();
      };
    })(ex);

    targetEl=document.createElement("div");
    targetEl.className="target";
    targetEl.textContent=ex.target||((ex.sets?ex.sets.length:ex.setCount||3)+" sets");

    tipEl=document.createElement("div");
    tipEl.className="tip";
    tipEl.textContent=ex.tip||"Edit the name above if you swapped the movement.";

    titleWrap.appendChild(nameInp);
    titleWrap.appendChild(targetEl);
    titleWrap.appendChild(tipEl);

    head.appendChild(cb);
    head.appendChild(titleWrap);
    art.appendChild(head);

    var photoSrc = ex.photo || "";
    if(!photoSrc){
      for(var pi=0;pi<DEFAULTS.length;pi++){
        if(DEFAULTS[pi].id===id && DEFAULTS[pi].photo){ photoSrc=DEFAULTS[pi].photo; break; }
      }
    }
    if(photoSrc){
      var img=document.createElement("img");
      img.className="ex-photo";
      img.src=photoSrc;
      img.alt=(ex.name||"Exercise")+" machine / equipment";
      img.loading="lazy";
      art.appendChild(img);
    }

    actions=document.createElement("div");
    actions.className="ex-actions";

    btnCopy=document.createElement("button");
    btnCopy.type="button";
    btnCopy.textContent="Copy set 1 \u2192 rest";
    btnCopy.onclick=(function(exRef){
      return function(){copySet1ToRest(exRef);};
    })(ex);
    actions.appendChild(btnCopy);

    btnBump25=document.createElement("button");
    btnBump25.type="button";
    btnBump25.className="bump";
    btnBump25.textContent="+2.5";
    btnBump25.title="Add 2.5 kg to set 1 weight";
    btnBump25.onclick=(function(exRef){
      return function(){bumpSet1(exRef,2.5);};
    })(ex);
    actions.appendChild(btnBump25);

    btnBump5=document.createElement("button");
    btnBump5.type="button";
    btnBump5.className="bump";
    btnBump5.textContent="+5";
    btnBump5.title="Add 5 kg to set 1 weight";
    btnBump5.onclick=(function(exRef){
      return function(){bumpSet1(exRef,5);};
    })(ex);
    actions.appendChild(btnBump5);

    btnAddSet=document.createElement("button");
    btnAddSet.type="button";
    btnAddSet.textContent="Add set";
    btnAddSet.onclick=(function(exRef){
      return function(){addSet(exRef);};
    })(ex);
    actions.appendChild(btnAddSet);

    if(ex.custom){
      btnRm=document.createElement("button");
      btnRm.type="button";
      btnRm.className="remove";
      btnRm.textContent="Remove";
      btnRm.onclick=(function(rid){
        return function(){
          if(!confirm("Remove this exercise?")) return;
          var ni, next=[];
          for(ni=0;ni<state.order.length;ni++){
            if(state.order[ni]!==rid) next.push(state.order[ni]);
          }
          state.order=next;
          try{delete state.exercises[rid];}catch(e){}
          save();
          render();
          toast("Removed");
        };
      })(id);
      actions.appendChild(btnRm);
    }

    art.appendChild(actions);

    labels=document.createElement("div");
    labels.className="set-labels";
    labels.innerHTML="<span>#</span><span>Weight</span><span>Reps</span><span>\u2713</span>";
    art.appendChild(labels);

    for(idx=0;idx<ex.sets.length;idx++){
      row=ex.sets[idx];
      div=document.createElement("div");
      div.className="set-row";
      div.innerHTML="<label>S"+(idx+1)+"</label><input type=\"number\" inputmode=\"decimal\" step=\"0.5\" min=\"0\" placeholder=\"kg\"/><input type=\"number\" inputmode=\"numeric\" step=\"1\" min=\"0\" placeholder=\""+(ex.rep_lo||8)+"-"+(ex.rep_hi||12)+"\"/><input type=\"checkbox\"/>";
      inputs=div.querySelectorAll("input");
      inputs[0].value=row.weight;
      inputs[1].value=row.reps;
      inputs[2].checked=!!row.done;
      (function(rowRef,exRef,artRef,inp0,inp1,inp2){
        inp0.addEventListener("input",function(){rowRef.weight=inp0.value;save();});
        inp1.addEventListener("input",function(){rowRef.reps=inp1.value;save();});
        inp2.addEventListener("change",function(){
          rowRef.done=inp2.checked;
          var all=true,z;
          for(z=0;z<exRef.sets.length;z++) if(!exRef.sets[z].done) all=false;
          if(all) exRef.done=true;
          else exRef.done=false;
          save();
          artRef.classList.toggle("done",exRef.done);
          updateProgress();
        });
      })(row,ex,art,inputs[0],inputs[1],inputs[2]);
      art.appendChild(div);
    }

    app.appendChild(art);
  }

  addBox=document.createElement("div");
  addBox.className="add-box";
  addBox.innerHTML="<h3>Add exercise</h3><div class=\"add-row\"><input type=\"text\" id=\"newName\" placeholder=\"Exercise name\"/><input type=\"number\" id=\"newSets\" min=\"1\" max=\"12\" value=\"3\" title=\"Sets\"/><button type=\"button\" class=\"add\" id=\"btnAdd\">+ Add</button></div>";
  app.appendChild(addBox);

  document.getElementById("btnAdd").onclick=function(){
    var nameEl=document.getElementById("newName");
    var setsEl=document.getElementById("newSets");
    var name=(nameEl.value||"").replace(/^\s+|\s+$/g,"");
    var n=parseInt(setsEl.value,10);
    if(!name){toast("Enter an exercise name");nameEl.focus();return;}
    if(!n||n<1) n=3;
    if(n>12) n=12;
    var nid=uid();
    state.exercises[nid]={
      name:name,
      target:n+" sets",
      tip:"Custom exercise",
      rep_lo:8,
      rep_hi:12,
      setCount:n,
      done:false,
      sets:makeSets(n, ""),
      custom:true
    };
    state.order.push(nid);
    save();
    render();
    toast("Added "+name);
  };

  updateProgress();
}

function exportToBot(){
  var text=buildExportText();
  var fname=SESSION.exportName+"_"+state.date+".txt";
  if(navigator.share){
    navigator.share({title:SESSION.sessionLabel+" export",text:text}).then(function(){
      toast("Shared — choose Health Bot");
    }).catch(function(){
      fallbackCopy(text, fname);
    });
    return;
  }
  fallbackCopy(text, fname);
}

function fallbackCopy(text, fname){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Copied — paste in Health Bot");
    }).catch(function(){
      prompt("Copy into Health Bot:",text);
    });
  } else {
    prompt("Copy into Health Bot:",text);
  }
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));
    a.download=fname||("workout_"+state.date+".txt");
    a.click();
  }catch(e){}
}

document.getElementById("btnExport").onclick=exportToBot;
document.getElementById("btnReset").onclick=function(){
  if(confirm("Clear this session? Custom exercises will be removed.")){
    state=emptyState();
    save();
    render();
    toast("Reset");
  }
};

try{
  applyHeader();
  render();
}catch(err){
  document.getElementById("app").innerHTML="<p class=\"noscript\">Logger failed to load: "+String(err)+"</p><ul class=\"static-list\"><li>Demo A</li><li>Demo B</li><li>Demo C</li></ul>";
}
})();
</script>
</body>
</html>
